<svg xmlns="http://www.w3.org/2000/svg" width="250" height="100" viewBox="0 0 250 100">
  <!--
    ESPHome MCP Server add-on logo (source). Rasterize with scripts/render-icons.py
    to logo.png (250x100) — Home Assistant reads the PNG, not this file.
    The pill background keeps the white wordmark readable in both HA themes.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F3D6B"/>
      <stop offset="0.55" stop-color="#136F93"/>
      <stop offset="1" stop-color="#17A2A0"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.15" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#04182B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="250" height="100" rx="20" fill="url(#bg)"/>
  <rect width="250" height="100" rx="20" fill="url(#hl)"/>

  <!-- chip mark: the icon's chip, scaled to ~64 px -->
  <g transform="translate(6 18) scale(0.5)">
    <g filter="url(#sh)">
      <g fill="#D3E2EE">
        <rect x="47" y="29" width="6" height="10" rx="1.5"/>
        <rect x="61" y="29" width="6" height="10" rx="1.5"/>
        <rect x="75" y="29" width="6" height="10" rx="1.5"/>
        <rect x="47" y="89" width="6" height="10" rx="1.5"/>
        <rect x="61" y="89" width="6" height="10" rx="1.5"/>
        <rect x="75" y="89" width="6" height="10" rx="1.5"/>
        <rect x="29" y="47" width="10" height="6" rx="1.5"/>
        <rect x="29" y="61" width="10" height="6" rx="1.5"/>
        <rect x="29" y="75" width="10" height="6" rx="1.5"/>
        <rect x="89" y="47" width="10" height="6" rx="1.5"/>
        <rect x="89" y="75" width="10" height="6" rx="1.5"/>
      </g>
      <path d="M89 64 H104" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>
      <circle cx="109" cy="64" r="7" fill="#FFFFFF"/>
      <circle cx="109" cy="64" r="3" fill="#17A2A0"/>
      <rect x="38" y="38" width="52" height="52" rx="8" fill="#EEF4F9"/>
    </g>
    <rect x="48" y="48" width="32" height="32" rx="4" fill="#1E2B3A"/>
    <rect x="52" y="52" width="24" height="24" rx="2.5" fill="none" stroke="#3A4F66" stroke-width="1.5"/>
    <circle cx="55.5" cy="55.5" r="2" fill="#EEF4F9" opacity="0.85"/>
    <g stroke="#17A2A0" stroke-width="2" stroke-linecap="round">
      <path d="M58 64 H70"/>
      <path d="M58 69 H66"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">
    <text x="78" y="46" font-size="24" font-weight="700" letter-spacing="0.2">ESPHome MCP</text>
    <text x="79" y="66" font-size="13" font-weight="400" opacity="0.85">Server for Claude Code</text>
    <text x="79" y="82" font-size="10" font-weight="400" opacity="0.6" letter-spacing="0.6">BERREVOETS SYSTEMS</text>
  </g>
</svg>
