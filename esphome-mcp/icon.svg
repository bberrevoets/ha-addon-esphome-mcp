<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    ESPHome MCP Server add-on icon (source). Rasterize with scripts/render-icons.py
    to icon.png (128x128) — Home Assistant reads the PNG, not this file.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F3D6B"/>
      <stop offset="0.55" stop-color="#136F93"/>
      <stop offset="1" stop-color="#17A2A0"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.22" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#04182B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <rect width="128" height="128" rx="26" fill="url(#hl)"/>

  <!-- chip: pins + body, lifted with a soft shadow -->
  <g filter="url(#sh)">
    <g fill="#D3E2EE">
      <!-- top pins -->
      <rect x="47" y="29" width="6" height="10" rx="1.5"/>
      <rect x="61" y="29" width="6" height="10" rx="1.5"/>
      <rect x="75" y="29" width="6" height="10" rx="1.5"/>
      <!-- bottom pins -->
      <rect x="47" y="89" width="6" height="10" rx="1.5"/>
      <rect x="61" y="89" width="6" height="10" rx="1.5"/>
      <rect x="75" y="89" width="6" height="10" rx="1.5"/>
      <!-- left pins -->
      <rect x="29" y="47" width="10" height="6" rx="1.5"/>
      <rect x="29" y="61" width="10" height="6" rx="1.5"/>
      <rect x="29" y="75" width="10" height="6" rx="1.5"/>
      <!-- right pins (the middle one becomes the MCP link trace) -->
      <rect x="89" y="47" width="10" height="6" rx="1.5"/>
      <rect x="89" y="75" width="10" height="6" rx="1.5"/>
    </g>
    <!-- link trace + node: "connected over MCP" -->
    <path d="M89 64 H104" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="109" cy="64" r="7" fill="#FFFFFF"/>
    <circle cx="109" cy="64" r="3" fill="#17A2A0"/>
    <!-- body -->
    <rect x="38" y="38" width="52" height="52" rx="8" fill="#EEF4F9"/>
  </g>

  <!-- die -->
  <rect x="48" y="48" width="32" height="32" rx="4" fill="#1E2B3A"/>
  <rect x="52" y="52" width="24" height="24" rx="2.5" fill="none" stroke="#3A4F66" stroke-width="1.5"/>
  <circle cx="55.5" cy="55.5" r="2" fill="#EEF4F9" opacity="0.85"/>
  <!-- three short bus lines: hint of "tools / protocol" inside the die -->
  <g stroke="#17A2A0" stroke-width="2" stroke-linecap="round">
    <path d="M58 64 H70"/>
    <path d="M58 69 H66"/>
  </g>
</svg>
