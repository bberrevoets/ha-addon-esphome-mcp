name: ESPHome MCP Server
version: 1.3.4
slug: esphome-mcp
description: >-
  MCP (Model Context Protocol) server exposing ESPHome operations as tools
  for Claude Code. Runs ESPHome commands locally on Home Assistant with
  direct filesystem access — no SSH required. Built on the official ESPHome
  (Debian/glibc) image so device compilation/flashing works.
url: https://github.com/bberrevoets/ha-addon-esphome-mcp
arch:
  - aarch64
  - amd64
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: MCP Streamable HTTP endpoint
map:
  # path and read_only are not optional here: homeassistant_config defaults to
  # read-only at /homeassistant, while the server works in /config/esphome.
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  auth_token: ""
schema:
  auth_token: str
startup: application
boot: auto
init: false
host_network: false
ingress: false
# Lets run.sh store an auto-generated auth token as the auth_token option
# (POST /addons/self/options) so it shows in the Configuration tab.
hassio_api: true
panel_icon: mdi:chip
